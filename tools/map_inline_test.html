<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
#map{width:100%;height:100%}
#debug{position:absolute;bottom:8px;left:8px;color:#0f0;background:rgba(0,0,0,0.75);padding:4px 8px;border-radius:4px;font-family:monospace;font-size:10px;z-index:999;pointer-events:none}
</style>
</head>
<body>
<div id="map" style="color:#9ca3af;text-align:center;padding-top:60%;font-family:sans-serif;font-size:14px">地图加载中...</div>
<div id="debug" style="display:none"></div>
<script>
window.onerror=function(m,s,l,c,e){try{window.ReactNativeWebView.postMessage(JSON.stringify({type:"error",message:String(m),line:l}))}catch(e2){}};

var _map=null,_userMarker=null,_manualLocMode=false;

function log(msg){try{document.getElementById("debug").innerHTML=msg}catch(e){}}

// WGS84 → BD09 (for scenic spot coordinates that were picked from WGS84 maps)
function wgs84ToBd09(lng,lat){
  var PI=Math.PI,X_PI=PI*3000/180,A=6378245,EE=0.006693421622965943;
  function tlat(x,y){var r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3;return r}
  function tlng(x,y){var r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3;return r}
  var dl=tlat(lng-105,lat-35),dn=tlng(lng-105,lat-35),r=lat/180*PI,m=Math.sin(r);m=1-EE*m*m;var s=Math.sqrt(m);
  dl=dl*180/((A*(1-EE))/(m*s)*PI);dn=dn*180/(A/s*Math.cos(r)*PI);
  var gl=lng+dn,gt=lat+dl,z=Math.sqrt(gl*gl+gt*gt)+0.00002*Math.sin(gt*X_PI),th=Math.atan2(gt,gl)+0.000003*Math.cos(gl*X_PI);
  return[z*Math.cos(th)+0.0065,z*Math.sin(th)+0.006];
}

function makeUserIcon(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3B82F6" stroke="#fff" stroke-width="3"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>';
  return "data:image/svg+xml;base64,"+btoa(svg);
}

function makeCenterIcon(){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#EF4444" stroke="#fff" stroke-width="2"/></svg>';
  return "data:image/svg+xml;base64,"+btoa(svg);
}

// Facility / spot markers (coords are BD09, picked from Baidu Maps — no conversion)
var FAC_COLORS={entrance:"#3B82F6",restroom:"#EC4899",parking:"#F59E0B",service:"#10B981",food:"#F97316"};
var _spotMarkers=[],_facMarkers=[],_routeLine=null,_walkingRoute=null,_userBd09=null;
function makeIcon(color,shape){var svg=shape==="pin"?'<svg xmlns="http://www.w3.org/2000/svg" width="28" height="42" viewBox="0 0 28 42"><filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/></filter><path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 28 14 28s14-17.5 14-28C28 6.3 21.7 0 14 0z" fill="'+color+'" filter="url(#s)"/><circle cx="14" cy="14" r="6" fill="#fff"/></svg>':'<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="'+color+'" stroke="#fff" stroke-width="2"/></svg>';return "data:image/svg+xml;base64,"+btoa(svg)}
function setFacilities(facilities){_facMarkers.forEach(function(m){try{_map.removeOverlay(m)}catch(e){}});_facMarkers=[];if(!facilities||!facilities.length){log("fac:0");return}facilities.forEach(function(f){try{var pt=new BMapGL.Point(f.lng,f.lat);var color=FAC_COLORS[f.kind]||"#6B7280";var icon=new BMapGL.Icon(makeIcon(color,"dot"),new BMapGL.Size(22,22),{anchor:new BMapGL.Size(11,11),imageSize:new BMapGL.Size(22,22)});var marker=new BMapGL.Marker(pt,{icon:icon});marker._fac=f;marker.addEventListener("click",function(){try{var w=new BMapGL.InfoWindow('<div style="font-family:sans-serif;padding:2px 4px;font-size:12px"><b>'+this._fac.name+"</b></div>",{width:140,height:36});_map.openInfoWindow(w,this.getPosition())}catch(e){}});_map.addOverlay(marker);_facMarkers.push(marker)}catch(e){}});log("fac:"+facilities.length)}
function setSpots(spots){_spotMarkers.forEach(function(m){try{_map.removeOverlay(m)}catch(e){}});_spotMarkers=[];if(!spots||!spots.length)return;spots.forEach(function(s){try{var pt=new BMapGL.Point(s.lng,s.lat);var icon=new BMapGL.Icon(makeIcon("#a855f7","pin"),new BMapGL.Size(28,42),{anchor:new BMapGL.Size(14,42),imageSize:new BMapGL.Size(28,42)});var marker=new BMapGL.Marker(pt,{icon:icon});marker._spot=s;_map.addOverlay(marker);_spotMarkers.push(marker);var label=new BMapGL.Label(s.name,{position:pt,offset:new BMapGL.Size(-16,-40)});label.setStyle({color:"#fff",background:"rgba(0,0,0,0.75)",border:"none",borderRadius:"3px",padding:"1px 5px",fontSize:"10px",whiteSpace:"nowrap"});_map.addOverlay(label);_spotMarkers.push(label);marker.addEventListener("click",function(){try{window.ReactNativeWebView.postMessage(JSON.stringify({type:"navigate",lat:this._spot.lat,lng:this._spot.lng,name:this._spot.name}))}catch(e){}})}catch(e){}})}

// All scenic/facility coords are BD09 (collected from Baidu Maps app).
// Only RN GPS coordinates are WGS84 and need wgs84ToBd09 conversion.
var CENTER_BD09 = [120.106595, 31.431031]; // 九龙灌浴（实采BD09坐标）

function initMap(){
  try{
    _map=new BMapGL.Map("map");
    _map.centerAndZoom(new BMapGL.Point(CENTER_BD09[0], CENTER_BD09[1]), 16);
    _map.setTilt(45);
    _map.enableScrollWheelZoom(true);
    try{_map.setMapStyle({style:"dark"})}catch(e){}

    // Scenic center marker
    var cpt=new BMapGL.Point(CENTER_BD09[0], CENTER_BD09[1]);
    var cIcon=new BMapGL.Icon(makeCenterIcon(),new BMapGL.Size(16,16),{anchor:new BMapGL.Size(8,8)});
    var cMk=new BMapGL.Marker(cpt,{icon:cIcon});
    _map.addOverlay(cMk);

    // Tap handler — in collect mode, each tap records a point; in manualLoc mode, sets user position
    _map.addEventListener("click",function(e){
      var lat=e.latlng.lat,lng=e.latlng.lng;
      if(_manualLocMode){
        // Map click coordinates are BD09, so pass source="baidu"
        setUserLocation(lat,lng,"baidu");
        _manualLocMode=false;
        document.getElementById("map").style.cursor="";
        log("手动定位:"+lat.toFixed(6)+","+lng.toFixed(6));
        return;
      }
      log("TAP:"+lat.toFixed(6)+","+lng.toFixed(6));
    });

    log("mapReady:"+CENTER_BD09[1]+","+CENTER_BD09[0]);
    window.ReactNativeWebView.postMessage(JSON.stringify({type:"mapReady"}));
  }catch(e){
    window.ReactNativeWebView.postMessage(JSON.stringify({type:"error",message:"init:"+String(e)}));
    document.getElementById("map").innerHTML='<div style="color:#f87171;text-align:center;padding-top:60%;font-family:sans-serif">失败:'+String(e)+"</div>";
  }
}

function setRoutePath(path){
  if(_routeLine){try{_map.removeOverlay(_routeLine)}catch(e){}}
  if(!path||!path.length)return;
  try{
    var pts=path.map(function(p){
      return new BMapGL.Point(p.lng,p.lat);
    });
    _routeLine=new BMapGL.Polyline(pts,{
      strokeColor:"#3B82F6",strokeWeight:4,strokeOpacity:0.8,
      strokeStyle:"dashed",enableEditing:false
    });
    _map.addOverlay(_routeLine);
    _map.setViewport(pts,{margins:[60,30,60,30]});
    log("route:"+path.length+"pts");
  }catch(e){log("routeErr:"+e)}
}
function setUserLocation(lat,lng,source){
  source=source||"rn";
  if(_userMarker){try{_map.removeOverlay(_userMarker)}catch(e){}}
  try{
    var bd;
    if(source==="baidu"){
      // Baidu Geolocation returns BD09 already
      bd=[lng,lat];
    }else{
      // RN GPS returns WGS84, must convert
      bd=wgs84ToBd09(lng,lat);
    }
    var pt=new BMapGL.Point(bd[0],bd[1]);
    var icon=new BMapGL.Icon(makeUserIcon(),new BMapGL.Size(24,24),{anchor:new BMapGL.Size(12,12),imageSize:new BMapGL.Size(24,24)});
    _userMarker=new BMapGL.Marker(pt,{icon:icon});
    _map.addOverlay(_userMarker);
    _userBd09=[bd[0],bd[1]];
    log("GPS("+source+"):"+lat.toFixed(5)+","+lng.toFixed(5));
    // Only report back to RN for native geo (Baidu GPS / manual tap) — avoid feedback loop
    if(source==="baidu"){
      window.ReactNativeWebView.postMessage(JSON.stringify({type:"userLocation",lat:lat,lng:lng,source:source}));
    }
  }catch(e){log("GPSerr:"+e)}
}

// ---- Baidu Maps built-in geolocation (works on Chinese phones without Google Play) ----
var _baiduGeo=null,_geoWatchId=null;
function startBaiduGeolocation(){
  try{
    if(!_map)return;
    _baiduGeo=new BMapGL.Geolocation();
    // First try a one-shot location
    _baiduGeo.getCurrentPosition(function(result){
      if(this.getStatus()===window.BMAP_STATUS_SUCCESS){
        var lat=result.point.lat,lng=result.point.lng;
        log("BaiduGeo:"+lat.toFixed(5)+","+lng.toFixed(5));
        // Baidu Geolocation returns BD09, so pass source="baidu"
        setUserLocation(lat,lng,"baidu");
      }else{
        log("BaiduGeo:fail("+this.getStatus()+")");
      }
    },{enableHighAccuracy:true});
  }catch(e){
    log("BaiduGeo:err:"+e);
  }
}

// Continuous watch via Baidu geolocation (fires every ~15s to conserve API quota)
function startBaiduGeoWatch(){
  try{
    if(!_map||_geoWatchId)return;
    _baiduGeo=new BMapGL.Geolocation();
    _geoWatchId=setInterval(function(){
      try{
        _baiduGeo.getCurrentPosition(function(result){
          if(this.getStatus()===window.BMAP_STATUS_SUCCESS){
            var lat=result.point.lat,lng=result.point.lng;
            setUserLocation(lat,lng,"baidu");
          }
        },{enableHighAccuracy:true,timeout:8000});
      }catch(e){}
    },15000);
  }catch(e){}
}

function stopBaiduGeoWatch(){
  if(_geoWatchId){clearInterval(_geoWatchId);_geoWatchId=null;}
}

function findWalkingRoute(toLat,toLng,fromLat,fromLng){
  if(_walkingRoute){try{_walkingRoute.clearResults()}catch(e){}}
  var slng=fromLng!=null?fromLng:_userBd09?.[0];
  var slat=fromLat!=null?fromLat:_userBd09?.[1];
  if(slng==null||slat==null){log("nav:no start");return}
  try{
    var start=new BMapGL.Point(slng,slat);
    var end=new BMapGL.Point(toLng,toLat);
    _walkingRoute=new BMapGL.WalkingRoute(_map,{renderOptions:{map:_map,autoViewport:true}});
    _walkingRoute.search(start,end);
    _walkingRoute.setSearchCompleteCallback(function(results){
      try{
        var ok=results&&(results.getStatus()===0||results.status===0);
        log("nav:"+(ok?"ok":"fail"));
      }catch(e){log("nav:done")}
    });
  }catch(e){log("navErr:"+e)}
}

var _navMarker=null;
function centerOn(lat,lng,zoom){
  try{
    var z=zoom||19;
    var pt=new BMapGL.Point(lng,lat);
    if(_navMarker){try{_map.removeOverlay(_navMarker)}catch(e){}}
    var icon=new BMapGL.Icon(makeIcon("#EF4444","pin"),new BMapGL.Size(28,42),{anchor:new BMapGL.Size(14,42),imageSize:new BMapGL.Size(28,42)});
    _navMarker=new BMapGL.Marker(pt,{icon:icon});
    _map.addOverlay(_navMarker);
    _map.centerAndZoom(pt,z);
    log("center:"+lat.toFixed(6)+","+lng.toFixed(6)+" z"+z);
  }catch(e){log("centerErr:"+e)}
}

function centerOnUser(){
  try{
    if(_userMarker){_map.centerAndZoom(_userMarker.getPosition(),18)}
    else{log("no marker")}
  }catch(e){}
}

function _onMapMsg(e){
  try{
    var d=JSON.parse(e.data);
    if(d.type==="setUserLocation") setUserLocation(d.lat,d.lng,d.source||"rn");
    else if(d.type==="centerOn"){

      // RN coords from collected data are already BD09
      centerOn(d.lat,d.lng,d.zoom);
    }
    else if(d.type==="centerOnUser") centerOnUser();
    else if(d.type==="setFacilities") setFacilities(d.facilities);
    else if(d.type==="setSpots") setSpots(d.spots);
    else if(d.type==="setRoutePath") setRoutePath(d.path);
    else if(d.type==="findWalkingRoute"){
      // RN coords from collected data are already BD09 — no conversion needed
      var toBd=[d.lng, d.lat]; // RN coords already BD09
      var flng=null,flat=null;
      if(d.fromLat!=null&&d.fromLng!=null){
        var fBd=[d.fromLng, d.fromLat]; // already BD09
        flng=fBd[0]; flat=fBd[1];
      }
      findWalkingRoute(toBd[1],toBd[0],flat,flng);
    }
    else if(d.type==="startManualLoc"){_manualLocMode=true;document.getElementById("map").style.cursor="crosshair";log("点击地图设置你的位置");}
    else if(d.type==="stopManualLoc"){_manualLocMode=false;document.getElementById("map").style.cursor="";}
    else if(d.type==="startBaiduGeoWatch") startBaiduGeoWatch();
    else if(d.type==="stopBaiduGeoWatch") stopBaiduGeoWatch();
    else if(d.type==="retryBaiduGeo") startBaiduGeolocation();
  }catch(ex){}
}
document.addEventListener("message",_onMapMsg);
window.addEventListener("message",_onMapMsg);

// SDK loading poll
var _el=document.getElementById("map");
var _t0=Date.now(),_n=0,_done=false;
var _poll=setInterval(function(){
  _n++;
  if(typeof BMapGL!=="undefined"){
    if(_done)return;_done=true;clearInterval(_poll);
    _el.innerHTML='<div style="color:#22c55e;text-align:center;padding-top:60%;font-family:sans-serif;font-size:14px">SDK OK</div>';
    setTimeout(function(){initMap();startBaiduGeolocation();},10);
  }else if(_n%20===0){
    _el.innerHTML='<div style="color:#f59e0b;text-align:center;padding-top:60%;font-family:sans-serif;font-size:14px">SDK '+Math.round((Date.now()-_t0)/1000)+'s</div>';
  }
},80);

setTimeout(function(){
  if(!_done&&typeof BMapGL==="undefined"){
    _done=true;clearInterval(_poll);
    _el.innerHTML='<div style="color:#f87171;text-align:center;padding-top:60%;font-family:sans-serif;font-size:14px">SDK超时('+Math.round((Date.now()-_t0)/1000)+'s)</div>';
  }
},15000);
</script>
<script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=9b3nqAd0qh8TvwOl2ubfa3QWv9LJggRL" onerror="document.getElementById('map').innerHTML='<div style=\"color:#f87171;text-align:center;padding-top:60%;font-family:sans-serif;font-size:14px\">SDK加载失败</div>'"></script>
</body>
</html>
