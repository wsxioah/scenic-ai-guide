<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>自动搜索灵山景区全部点位坐标</title>
<style>
body{font-family:monospace;padding:20px;background:#1a1a2e;color:#e5e7eb}
h2{color:#f59e0b}
.status{color:#9ca3af;font-size:12px}
.result{background:#111827;padding:8px;margin:4px 0;border-radius:4px;border-left:3px solid #2563EB}
.result .name{color:#22c55e;font-weight:bold}
.result .coord{color:#f59e0b}
.result .addr{color:#6b7280;font-size:11px}
.error{color:#f87171}
.btn{padding:8px 16px;margin:8px 4px;background:#2563EB;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn:hover{background:#1d4ed8}
#output{margin-top:12px;max-height:600px;overflow-y:auto}
pre{background:#0f172a;padding:12px;border-radius:4px;color:#22c55e;font-size:12px;white-space:pre-wrap}
.section{color:#f59e0b;margin:12px 0 4px;font-weight:bold}
</style>
</head>
<body>
<h2>灵山景区全部点位坐标自动搜索 (BD09)</h2>
<p class="status" id="status">加载百度地图SDK...</p>
<div style="display:none" id="map"></div>
<button class="btn" id="copyBtn" style="display:none" onclick="copyResults()">📋 复制全部TypeScript代码</button>
<div id="output"></div>

<script>
var MAP;
var ALL_RESULTS = [];
var SPOT_RESULTS = [];
var FAC_RESULTS = [];
var ERRORS = [];
// 16 景点
var SPOTS = [
  '灵山大照壁','五明桥','佛足坛','五智门','菩提大道',
  '九龙灌浴','降魔浮雕','阿育王柱','百子戏弥勒','祥符禅寺',
  '灵山大佛','佛教文化博览馆','灵山梵宫','五印坛城','曼飞龙塔','无尽意斋'
];
// 13 设施
var FACILITIES = [
  {name:'南门主入口', query:'灵山胜境南门'},
  {name:'东门入口', query:'灵山胜境东门'},
  {name:'南门卫生间', query:'灵山胜境南门卫生间'},
  {name:'九龙灌浴卫生间', query:'灵山九龙灌浴卫生间'},
  {name:'梵宫卫生间', query:'灵山梵宫卫生间'},
  {name:'大佛脚下卫生间', query:'灵山大佛卫生间'},
  {name:'祥符禅寺卫生间', query:'灵山祥符禅寺卫生间'},
  {name:'南门停车场', query:'灵山胜境停车场'},
  {name:'东门停车场', query:'灵山胜境东门停车场'},
  {name:'游客服务中心', query:'灵山胜境游客服务中心'},
  {name:'梵宫素斋餐饮', query:'灵山梵宫素斋'},
  {name:'素面馆', query:'灵山胜境素面'},
  {name:'灵山精舍', query:'无锡灵山精舍'},
];
var ALL = [];
SPOTS.forEach(function(s){ ALL.push({name:s, query:s+' 灵山', type:'spot'}); });
FACILITIES.forEach(function(f){ ALL.push({name:f.name, query:f.query, type:'fac'}); });
var current = 0;

function searchNext() {
  if (current >= ALL.length) {
    showResults();
    return;
  }
  var item = ALL[current];
  document.getElementById('status').innerHTML = '搜索中: ' + (current+1) + '/' + ALL.length + ' — ' + item.query + ' ...';
  var ls = new BMapGL.LocalSearch(MAP, {
    onSearchComplete: function(results) {
      if (results && results.getNumPois() > 0) {
        var p = results.getPoi(0);
        var r = { name: item.name, lat: p.point.lat, lng: p.point.lng, type: item.type, addr: p.address||'' };
        ALL_RESULTS.push(r);
        if (item.type === 'spot') SPOT_RESULTS.push(r);
        else FAC_RESULTS.push(r);
        showResult(r, true);
      } else {
        ERRORS.push(item.name);
        showResult({name: item.name, type: item.type}, false);
      }
      current++;
      setTimeout(searchNext, 700);
    }
  });
  ls.search(item.query);
}

function showResult(r, ok) {
  var el = document.getElementById('output');
  if (ok) {
    el.innerHTML += '<div class="result"><span class="name">'+r.name+'</span> <span class="coord">BD09 lat:'+r.lat.toFixed(6)+' lng:'+r.lng.toFixed(6)+'</span><br><span class="addr">'+r.addr+'</span></div>';
  } else {
    el.innerHTML += '<div class="result"><span class="error">'+r.name+' — 未找到</span></div>';
  }
}

function showResults() {
  document.getElementById('status').innerHTML = '搜索完成! 景点:'+SPOT_RESULTS.length+'/'+SPOTS.length+' 设施:'+FAC_RESULTS.length+'/'+FACILITIES.length;
  document.getElementById('copyBtn').style.display = 'inline-block';

  var el = document.getElementById('output');
  el.innerHTML += '<div class="section">=== 景点 (SCENIC_SPOTS) ===</div>';
  var spotLines = [];
  SPOT_RESULTS.forEach(function(r, i) {
    spotLines.push("  { id: 'LS-"+String(i+1).padStart(3,'0')+"', name: '"+r.name+"', lat: "+r.lat.toFixed(6)+", lng: "+r.lng.toFixed(6)+", category: '人文', desc: '' },");
  });
  el.innerHTML += '<pre>'+spotLines.join('\n')+'</pre>';

  el.innerHTML += '<div class="section">=== 设施 (FACILITIES) ===</div>';
  var facLines = [];
  var facKinds = {
    '入口': 'entrance', '卫生间': 'restroom', '停车场': 'parking', '服务': 'service',
    '餐饮': 'food', '素斋': 'food', '素面': 'food', '精舍': 'food'
  };
  FAC_RESULTS.forEach(function(r) {
    var kind = 'service';
    for (var k in facKinds) { if (r.name.indexOf(k) >= 0) { kind = facKinds[k]; break; } }
    facLines.push("  { id: 'f-"+kind.substring(0,4)+"', name: '"+r.name+"', lat: "+r.lat.toFixed(6)+", lng: "+r.lng.toFixed(6)+", kind: '"+kind+"' },");
  });
  el.innerHTML += '<pre id="fac-code">'+facLines.join('\n')+'</pre>';

  document.getElementById('all-code') || (function(){
    var pre = document.createElement('pre');
    pre.id = 'all-code';
    pre.style.display = 'none';
    pre.textContent = 'SPOTS:\n'+spotLines.join('\n')+'\n\nFACILITIES:\n'+facLines.join('\n');
    document.getElementById('output').appendChild(pre);
  })();
}

function copyResults() {
  var spotPre = document.querySelectorAll('pre');
  var txt = '=== SCENIC_SPOTS ===\n' + spotPre[0].textContent + '\n\n=== FACILITIES ===\n' + spotPre[1].textContent;
  navigator.clipboard.writeText(txt).then(function() {
    alert('已复制全部坐标!');
  });
}

function initMap() {
  MAP = new BMapGL.Map('map');
  MAP.centerAndZoom(new BMapGL.Point(120.101375, 31.424900), 16);
  document.getElementById('status').innerHTML = 'SDK就绪，开始搜索29个点位...';
  setTimeout(searchNext, 500);
}

var _poll = setInterval(function() {
  if (typeof BMapGL !== 'undefined') { clearInterval(_poll); initMap(); }
}, 80);
setTimeout(function() {
  if (typeof BMapGL === 'undefined') { clearInterval(_poll); document.getElementById('status').innerHTML = 'BMapGL加载失败'; }
}, 15000);
</script>
<script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=9b3nqAd0qh8TvwOl2ubfa3QWv9LJggRL"></script>
</body>
</html>
