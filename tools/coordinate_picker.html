<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>灵山景区坐标拾取工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:-apple-system,sans-serif;overflow:hidden}
#map{width:100%;height:100%}
#panel{position:absolute;top:10px;right:10px;width:300px;max-height:90%;background:rgba(255,255,255,0.95);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.3);overflow-y:auto;z-index:1000;font-size:13px}
#panel h3{padding:12px;margin:0;background:#2563EB;color:#fff;font-size:14px;border-radius:8px 8px 0 0}
#panel .body{padding:10px}
.coord-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;margin:2px 0;background:#F3F4F6;border-radius:4px;cursor:pointer}
.coord-row:hover{background:#DBEAFE}
.coord-row .label{font-weight:600;color:#1F2937;font-size:11px}
.coord-row .val{color:#2563EB;font-family:monospace;font-size:11px}
.coord-row .copy{color:#6B7280;font-size:10px;cursor:pointer;margin-left:4px}
.btn{display:block;width:100%;margin:6px 0;padding:8px;border:none;border-radius:4px;font-size:12px;cursor:pointer;font-weight:600}
.btn-primary{background:#2563EB;color:#fff}
.btn-danger{background:#EF4444;color:#fff}
.btn-green{background:#10B981;color:#fff}
.ref-point{padding:6px 8px;margin:2px 0;background:#FEF3C7;border-radius:4px;border-left:3px solid #F59E0B}
.ref-point .name{font-weight:700;color:#92400E;font-size:12px}
.ref-point .desc{font-size:10px;color:#B45309}
#current-coord{padding:8px;background:#D1FAE5;border-radius:4px;margin:6px 0;border-left:3px solid #10B981}
#current-coord .title{font-weight:700;color:#065F46;font-size:12px}
#current-coord .latlng{font-family:monospace;color:#047857;font-size:14px;font-weight:700}
.hint{padding:8px;font-size:10px;color:#6B7280;background:#F9FAFB;border-radius:4px;text-align:center}
#saved-list{max-height:200px;overflow-y:auto}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>📍 灵山景区坐标拾取</h3>
  <div class="body">
    <div class="hint">🖱 点击地图任意位置获取BD09坐标</div>
    <div style="display:flex;gap:4px;margin:4px 0">
      <input id="search-box" placeholder="搜索景点..." style="flex:1;padding:6px 8px;border:1px solid #D1D5DB;border-radius:4px;font-size:11px" onkeypress="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" style="padding:6px 12px;background:#2563EB;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer">🔍</button>
    </div>
    <div id="current-coord" style="display:none">
      <div class="title">最后点击位置 (BD09)</div>
      <div class="latlng" id="click-latlng">--</div>
    </div>
    <div class="ref-point" onclick="centerOn(31.424900,120.101375)">
      <div class="name">🔸 基准点: 九龙灌浴(太子像)</div>
      <div class="desc">BD09 lat:31.424900 lng:120.101375</div>
    </div>
    <div class="ref-point" onclick="centerOn(31.427301,120.101376)">
      <div class="name">🔸 灵山大佛(88m)</div>
      <div class="desc">BD09 lat:31.427301 lng:120.101376</div>
    </div>
    <div class="ref-point" onclick="centerOn(31.422684,120.100578)">
      <div class="name">🔸 灵山大照壁(南门)</div>
      <div class="desc">BD09 lat:31.422684 lng:120.100578</div>
    </div>
    <button class="btn btn-green" onclick="exportSaved()">📋 复制已保存坐标</button>
    <button class="btn btn-primary" onclick="saveCurrent()">💾 保存当前坐标</button>
    <button class="btn btn-danger" onclick="clearSaved()">🗑 清空已保存</button>
    <div id="saved-count" style="font-size:11px;color:#6B7280;text-align:center;margin:4px 0">已保存: 0 个</div>
    <div id="saved-list"></div>
  </div>
</div>
<script>
var _map;
var _clickMarker;
var _lastLat, _lastLng;
var _saved = [];

function initMap() {
  _map = new BMapGL.Map('map');
  _map.centerAndZoom(new BMapGL.Point(120.101375, 31.424900), 17);
  _map.setTilt(45);
  _map.enableScrollWheelZoom(true);
  _map.setMapStyle({ style: 'normal' });

  // 基准标记：九龙灌浴/太子佛
  var icon = new BMapGL.Icon(
    'data:image/svg+xml;base64,' + btoa(
      '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">'
      + '<filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4"/></filter>'
      + '<path d="M16 0C7.2 0 0 7.2 0 16c0 12 16 26 16 26s16-14 16-26C32 7.2 24.8 0 16 0z" fill="#F59E0B" filter="url(#s)"/>'
      + '<circle cx="16" cy="16" r="7" fill="#fff"/><text x="16" y="20" text-anchor="middle" font-size="10" fill="#F59E0B">★</text></svg>'
    ),
    new BMapGL.Size(32, 42), { anchor: new BMapGL.Size(16, 42) }
  );
  var baseMarker = new BMapGL.Marker(new BMapGL.Point(120.101375, 31.424900), { icon: icon });
  _map.addOverlay(baseMarker);

  var baseLabel = new BMapGL.Label('太子佛(基准点)', {
    position: new BMapGL.Point(120.101375, 31.424900),
    offset: new BMapGL.Size(-30, -40)
  });
  baseLabel.setStyle({
    color: '#92400E', background: '#FEF3C7', border: '1px solid #F59E0B',
    borderRadius: '4px', padding: '2px 8px', fontSize: '12px',
    fontWeight: '700', fontFamily: 'sans-serif', whiteSpace: 'nowrap'
  });
  _map.addOverlay(baseLabel);

  // 灵山大佛标记
  var buddhaIcon = new BMapGL.Icon(
    'data:image/svg+xml;base64,' + btoa(
      '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 32 42">'
      + '<filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.4"/></filter>'
      + '<path d="M16 0C7.2 0 0 7.2 0 16c0 12 16 26 16 26s16-14 16-26C32 7.2 24.8 0 16 0z" fill="#DC2626" filter="url(#s)"/>'
      + '<circle cx="16" cy="16" r="7" fill="#fff"/></svg>'
    ),
    new BMapGL.Size(32, 42), { anchor: new BMapGL.Size(16, 42) }
  );
  _map.addOverlay(new BMapGL.Marker(new BMapGL.Point(120.101376, 31.427301), { icon: buddhaIcon }));

  // 点击事件
  _map.addEventListener('click', function(e) {
    var pt = e.latlng;
    _lastLat = pt.lat;
    _lastLng = pt.lng;
    document.getElementById('current-coord').style.display = 'block';
    document.getElementById('click-latlng').textContent = 'lat: ' + pt.lat.toFixed(6) + '  lng: ' + pt.lng.toFixed(6);
    if (_clickMarker) _map.removeOverlay(_clickMarker);
    _clickMarker = new BMapGL.Marker(pt);
    _map.addOverlay(_clickMarker);
  });
}

function centerOn(lat, lng) {
  _map.centerAndZoom(new BMapGL.Point(lng, lat), 18);
}

function saveCurrent() {
  if (!_lastLat || !_lastLng) {
    alert('请先点击地图选择坐标');
    return;
  }
  var name = prompt('坐标名称（如"大佛平台"）:');
  if (!name) return;
  _saved.push({ name: name, lat: _lastLat, lng: _lastLng });
  renderSaved();
}

function renderSaved() {
  document.getElementById('saved-count').textContent = '已保存: ' + _saved.length + ' 个';
  var html = '';
  _saved.forEach(function(s, i) {
    html += '<div class="coord-row" onclick="centerOn(' + s.lat + ',' + s.lng + ')">'
      + '<span class="label">' + (i+1) + '. ' + s.name + '</span>'
      + '<span class="val">' + s.lat.toFixed(6) + ', ' + s.lng.toFixed(6) + '</span>'
      + '<span class="copy" onclick="event.stopPropagation();navigator.clipboard.writeText(\'{id: \\'LS-\\', name: \\'' + s.name + '\\', lat: ' + s.lat.toFixed(6) + ', lng: ' + s.lng.toFixed(6) + ', category: \\'人文\\', desc: \\'\\'},\')">📋</span>'
      + '</div>';
  });
  document.getElementById('saved-list').innerHTML = html;
}

function exportSaved() {
  if (_saved.length === 0) {
    alert('没有保存的坐标');
    return;
  }
  var lines = [];
  _saved.forEach(function(s) {
    lines.push('{ id: \'LS-\', name: \'' + s.name + '\', lat: ' + s.lat.toFixed(6) + ', lng: ' + s.lng.toFixed(6) + ', category: \'人文\', desc: \'\' },');
  });
  navigator.clipboard.writeText(lines.join('\n')).then(function() {
    alert('已复制 ' + _saved.length + ' 个坐标到剪贴板');
  });
}

function clearSaved() {
  if (confirm('确认清空所有已保存坐标?')) { _saved = []; renderSaved(); }
}

// 加载地图
var _poll = setInterval(function() {
  if (typeof BMapGL !== 'undefined') { clearInterval(_poll); initMap(); }
}, 100);
</script>
<script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=9b3nqAd0qh8TvwOl2ubfa3QWv9LJggRL"></script>
</body>
</html>
