<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI数字人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #live2dStage { width: 100%; height: 100%; position: relative; }
        #live2dCanvas { display: block; width: 100%; height: 100%; }
        #statusOverlay {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.45); color: #fff; padding: 3px 14px;
            border-radius: 10px; font-size: 12px; font-family: sans-serif;
            pointer-events: none; z-index: 10;
        }
    </style>
    <script src="/digital-human/js/pixi.min.js"></script>
    <script src="/digital-human/js/live2dcubismcore.min.js"></script>
    <script src="/digital-human/js/cubism4.js"></script>
</head>
<body>
    <div id="live2dStage">
        <canvas id="live2dCanvas"></canvas>
        <div id="statusOverlay">加载中...</div>
        <div id="dh-debug" style="position:absolute;top:4px;left:4px;color:#ff0;background:rgba(0,0,0,0.85);padding:3px 8px;border-radius:4px;font-family:monospace;font-size:12px;z-index:99;pointer-events:none">init...</div>
    </div>

    <script src="/digital-human/js/lipsync.js"></script>
    <script>
    var pixiApp = null;
    var model = null;
    var lipSync = null;
    var audioElement = null;

    // Different models use different mouth param IDs (Chitose uses the legacy
    // PARAM_MOUTH_OPEN_Y, haru uses ParamMouthOpenY). Setting an unknown id is a
    // harmless no-op in Cubism core, so drive both.
    var MOUTH_PARAMS = ["ParamMouthOpenY", "PARAM_MOUTH_OPEN_Y"];
    function setMouthOpen(v) {
        if (!model || !model.internalModel || !model.internalModel.coreModel) return;
        var cm = model.internalModel.coreModel;
        for (var k = 0; k < MOUTH_PARAMS.length; k++) {
            try { cm.setParameterValueById(MOUTH_PARAMS[k], v); } catch (e) {}
        }
    }

    var FEMALE_MODEL = "/digital-human/live2d/models/haru_greeter_t03.model3.json";
    var MALE_MODEL = "/digital-human/live2d/models-chitose/chitose.model3.json";
    function getModelUrl() {
        try {
            var m = new URLSearchParams(location.search).get("model");
            return m === "male" ? MALE_MODEL : FEMALE_MODEL;
        } catch(e) { return FEMALE_MODEL; }
    }

    function fitModelToViewport() {
        if (!model || !model.internalModel || !model.internalModel.originalWidth) return;
        var stage = document.getElementById("live2dStage");
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        var mw = model.internalModel.originalWidth;
        var mh = model.internalModel.originalHeight;
        if (!mw || !mh) return;

        var fitScale = (h * 0.90) / mh;
        var widthScale = (w * 0.90) / mw;
        var scale = Math.min(fitScale, widthScale);

        model.scale.set(scale);
        model.anchor.set(0.5, 0);
        model.x = w / 2;
        model.y = h * 0.02;
        console.log("Fit: canvas=" + w + "x" + h + " model=" + mw + "x" + mh + " scale=" + scale.toFixed(4));
    }

    async function initLive2D() {
        var canvas = document.getElementById("live2dCanvas");
        var stage = document.getElementById("live2dStage");
        var w = stage.clientWidth;
        var h = stage.clientHeight;

        var origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attrs) {
            if (type === "webgl" || type === "webgl2") {
                attrs = Object.assign({}, attrs || {}, { premultipliedAlpha: false });
            }
            return origGetContext.call(this, type, attrs);
        };

        PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.LINEAR;

        try {
            pixiApp = new PIXI.Application({
                view: canvas, width: w, height: h, transparent: true,
                resolution: window.devicePixelRatio || 1,
                autoDensity: true, backgroundAlpha: 0,
            });
        } catch(e) {
            setStatus("引擎加载失败");
            return;
        }

        HTMLCanvasElement.prototype.getContext = origGetContext;

        try {
            model = await PIXI.live2d.Live2DModel.from(getModelUrl());
        } catch(e) {
            console.error("Live2D primary load failed, falling back to female:", e);
            try {
                model = await PIXI.live2d.Live2DModel.from(FEMALE_MODEL);
            } catch(e2) {
                console.error("Live2D load:", e2);
                setStatus("模型加载失败");
                return;
            }
        }
        pixiApp.stage.addChild(model);
        fitModelToViewport();
        setStatus("在线");

        lipSync = new LipSync();
        dhDebug("ready");

        window.addEventListener("resize", function() {
            var sw = stage.clientWidth, sh = stage.clientHeight;
            if (pixiApp) { pixiApp.renderer.resize(sw, sh); fitModelToViewport(); }
        });

        notifyRN({ ready: true });

        // Delayed re-fit for mobile WebView (layout may not be ready on first paint)
        setTimeout(function() {
            if (pixiApp) {
                var sw = stage.clientWidth, sh = stage.clientHeight;
                if (sw > 0 && sh > 0) {
                    pixiApp.renderer.resize(sw, sh);
                    fitModelToViewport();
                }
            }
        }, 300);
        setTimeout(function() {
            if (pixiApp) {
                var sw = stage.clientWidth, sh = stage.clientHeight;
                if (sw > 0 && sh > 0) {
                    pixiApp.renderer.resize(sw, sh);
                    fitModelToViewport();
                }
            }
        }, 1000);
    }

    function setStatus(text) {
        document.getElementById("statusOverlay").textContent = text;
    }

    function notifyRN(data) {
        try {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(data));
            }
        } catch(e) {}
    }

    function dhDebug(msg) {
        try { document.getElementById("dh-debug").textContent = msg; } catch(e) {}
        console.log("[DH] " + msg);
    }


    // ===== Lipsync-enhanced Audio Playback =====
    function playAudio(url) {
        if (audioElement) { audioElement.pause(); audioElement = null; }
        if (lipSync) lipSync.stop();

        setStatus("说话中...");
        audioElement = new Audio(url);

        audioElement.addEventListener("canplaythrough", function() {
            var p = audioElement.play();
            if (p) {
                p.catch(function(e) {
                    console.warn("Play failed, retrying:", e.message);
                    audioElement.play().catch(function(e2) {
                        console.error("Play failed completely:", e2.message);
                    });
                });
            }
        });

        if (lipSync && model) {
            lipSync.start(audioElement, function(mouthOpen) {
                setMouthOpen(Math.max(0, Math.min(1, mouthOpen * 3.0)));
            }, { muted: false });
        }

        audioElement.addEventListener("ended", function() {
            if (lipSync) lipSync.stop();
            audioElement = null;
            setStatus("在线");
            notifyRN({ audioEnded: true });
        });

        audioElement.addEventListener("error", function(e) {
            console.error("Audio error:", e);
            if (lipSync) lipSync.stop();
            audioElement = null;
            setStatus("在线");
            notifyRN({ audioError: true });
        });
    }

    // Silent audio playback for lip-sync analysis only (RN handles audible output)
    // Uses a queue so chunks play sequentially without killing each other
    var _lipSyncQueue = [];
    var _lipSyncActive = false;
    var _lipSyncSourceId = 0;  // incrementing ID to guard against stale ended events

    function _runLipSyncQueue() {
        if (_lipSyncQueue.length === 0) {
            _lipSyncActive = false;
            dhDebug("online");
            setMouthOpen(0);
            return;
        }
        _lipSyncActive = true;
        var url = _lipSyncQueue.shift();
        var mySourceId = ++_lipSyncSourceId;

        dhDebug("lipsync:" + mySourceId + " fetching...");

        var ctx = lipSync.audioContext || new (window.AudioContext || window.webkitAudioContext)();
        lipSync.audioContext = ctx;

        // Always resume AudioContext — Android may auto-suspend between chunks
        var ready = (ctx.state === "suspended")
            ? ctx.resume().catch(function(e) { dhDebug("ctx_resume_err:"+e.message); })
            : Promise.resolve();
        ready.then(function() {
            return fetch(url);
        })
        .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            dhDebug("lipsync:" + mySourceId + " got " + Math.round(parseInt(r.headers.get("content-length")||"0")/1024) + "kB");
            return r.arrayBuffer();
        })
        .then(function(buf) {
            dhDebug("lipsync:" + mySourceId + " decoding " + Math.round(buf.byteLength/1024) + "kB");
            return ctx.decodeAudioData(buf);
        })
        .then(function(audioBuffer) {
            // Guard: another source has started since, don't bother
            if (_lipSyncSourceId !== mySourceId) {
                dhDebug("lipsync:" + mySourceId + " superseded");
                return;
            }

            dhDebug("lipsync:" + mySourceId + " playing " + audioBuffer.duration.toFixed(1) + "s");

            // Stop & disconnect any previous source so its ended event won't fire
            if (lipSync.source) {
                try { lipSync.source.stop(); } catch(e) {}
                try { lipSync.source.disconnect(); } catch(e) {}
            }

            var source = ctx.createBufferSource();
            source.buffer = audioBuffer;
            var analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.4;
            source.connect(analyser);

            lipSync.source = source;
            lipSync.analyser = analyser;
            lipSync.isRunning = true;
            lipSync.onMouthUpdate = function(mouthOpen) {
                setMouthOpen(Math.max(0, Math.min(1, mouthOpen * 3.0)));
            };
            lipSync._loop();

            source.addEventListener("ended", function() {
                dhDebug("lipsync:" + mySourceId + " done");
                if (lipSync) lipSync.stop();
                _runLipSyncQueue();  // play next in queue, not just "online"
            });

            source.start(0);
        })
        .catch(function(e) {
            dhDebug("lipsync_err:" + (e.message || String(e)));
            _runLipSyncQueue();  // skip this one, try next
        });
    }

    function playAudioForLipSync(url) {
        if (!lipSync || !model) {
            dhDebug("lipsync: no lipSync/model");
            return;
        }
        // Stop any currently playing source immediately
        if (lipSync.source) {
            try { lipSync.source.stop(); } catch(e) {}
            try { lipSync.source.disconnect(); } catch(e) {}
        }
        if (lipSync) lipSync.stop();
        _lipSyncQueue.push(url);
        if (!_lipSyncActive) {
            _runLipSyncQueue();
        }
    }

    // ===== Handle React Native commands (via injectJavaScript) =====
    // postMessage bridge is unreliable on Android WebView, so RN calls
    // this global function directly via injectJavaScript
    window.dhHandleCommand = function(jsonStr) {
        var data;
        try { data = JSON.parse(jsonStr); } catch(e) { dhDebug("parse_err"); return; }

        dhDebug("rx:" + data.action);

        switch (data.action) {
            case "speak":
                if (data.base64Audio) {
                    var byteStr = atob(data.base64Audio);
                    var bytes = new Uint8Array(byteStr.length);
                    for (var i = 0; i < byteStr.length; i++) {
                        bytes[i] = byteStr.charCodeAt(i);
                    }
                    var blob = new Blob([bytes], { type: "audio/mp3" });
                    playAudio(URL.createObjectURL(blob));
                } else if (data.audioUrl) {
                    playAudio(data.audioUrl);
                }
                break;

            case "lipSync":
                if (data.audioUrl) {
                    playAudioForLipSync(data.audioUrl);
                }
                break;

            case "idle":
                if (audioElement) { audioElement.pause(); audioElement = null; }
                if (lipSync) lipSync.stop();
                setStatus("在线");
                break;

            case "setStatus":
                setStatus(data.text);
                break;
        }
    };

    // Unlock AudioContext on first user touch (required by mobile Web Audio policy)
    function unlockAudio() {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') {
            ctx.resume().then(function() {
                console.log('[DH] AudioContext unlocked');
            });
        }
        document.removeEventListener('touchstart', unlockAudio);
        document.removeEventListener('click', unlockAudio);
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    // Bootstrap
    initLive2D().catch(function(e) {
        console.error("Live2D init error:", e);
    });
    </script>
</body>
</html>
