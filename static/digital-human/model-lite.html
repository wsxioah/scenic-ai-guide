<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI数字人</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #live2dStage { width: 100%; height: 100%; position: relative; }
        #live2dCanvas { display: block; width: 100%; height: 100%; }
        #statusOverlay {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.45); color: #fff; padding: 3px 14px;
            border-radius: 10px; font-size: 12px; font-family: sans-serif;
            pointer-events: none; z-index: 10;
        }
    </style>
    <script src="/digital-human/js/pixi.min.js"></script>
    <script src="/digital-human/js/live2dcubismcore.min.js"></script>
    <script src="/digital-human/js/cubism4.js"></script>
</head>
<body>
    <div id="live2dStage">
        <canvas id="live2dCanvas"></canvas>
        <div id="statusOverlay">加载中...</div>
    </div>

    <script src="/digital-human/js/lipsync.js"></script>
    <script>
    var pixiApp = null;
    var model = null;
    var lipSync = null;
    var audioElement = null;

    function fitModelToViewport() {
        if (!model || !model.internalModel || !model.internalModel.originalWidth) return;
        var stage = document.getElementById("live2dStage");
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        var mw = model.internalModel.originalWidth;
        var mh = model.internalModel.originalHeight;
        if (!mw || !mh) return;

        var fitScale = (h * 0.90) / mh;
        var widthScale = (w * 0.90) / mw;
        var scale = Math.min(fitScale, widthScale);

        model.scale.set(scale);
        model.anchor.set(0.5, 0);
        model.x = w / 2;
        model.y = h * 0.02;
        console.log("Fit: canvas=" + w + "x" + h + " model=" + mw + "x" + mh + " scale=" + scale.toFixed(4));
    }

    async function initLive2D() {
        var canvas = document.getElementById("live2dCanvas");
        var stage = document.getElementById("live2dStage");
        var w = stage.clientWidth;
        var h = stage.clientHeight;

        var origGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attrs) {
            if (type === "webgl" || type === "webgl2") {
                attrs = Object.assign({}, attrs || {}, { premultipliedAlpha: false });
            }
            return origGetContext.call(this, type, attrs);
        };

        PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.LINEAR;

        try {
            pixiApp = new PIXI.Application({
                view: canvas, width: w, height: h, transparent: true,
                resolution: window.devicePixelRatio || 1,
                autoDensity: true, backgroundAlpha: 0,
            });
        } catch(e) {
            setStatus("引擎加载失败");
            return;
        }

        HTMLCanvasElement.prototype.getContext = origGetContext;

        try {
            model = await PIXI.live2d.Live2DModel.from(
                "/digital-human/live2d/models/haru_greeter_t03.model3.json"
            );
            pixiApp.stage.addChild(model);
            fitModelToViewport();
            setStatus("在线");
        } catch(e) {
            console.error("Live2D load:", e);
            setStatus("模型加载失败");
            return;
        }

        lipSync = new LipSync();

        window.addEventListener("resize", function() {
            var sw = stage.clientWidth, sh = stage.clientHeight;
            if (pixiApp) { pixiApp.renderer.resize(sw, sh); fitModelToViewport(); }
        });

        notifyRN({ ready: true });
    }

    function setStatus(text) {
        document.getElementById("statusOverlay").textContent = text;
    }

    function notifyRN(data) {
        try {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(data));
            }
        } catch(e) {}
    }

    // ===== Lipsync-enhanced Audio Playback =====
    function playAudio(url) {
        if (audioElement) { audioElement.pause(); audioElement = null; }
        if (lipSync) lipSync.stop();

        setStatus("说话中...");
        audioElement = new Audio(url);

        audioElement.addEventListener("canplaythrough", function() {
            var p = audioElement.play();
            if (p) {
                p.catch(function(e) {
                    console.warn("Play failed, retrying:", e.message);
                    audioElement.play().catch(function(e2) {
                        console.error("Play failed completely:", e2.message);
                    });
                });
            }
        });

        if (lipSync && model) {
            lipSync.start(audioElement, function(mouthOpen) {
                if (model && model.internalModel && model.internalModel.coreModel) {
                    var v = Math.max(0, Math.min(1, mouthOpen));
                    model.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", v);
                }
            });
        }

        audioElement.addEventListener("ended", function() {
            if (lipSync) lipSync.stop();
            audioElement = null;
            setStatus("在线");
            notifyRN({ audioEnded: true });
        });

        audioElement.addEventListener("error", function(e) {
            console.error("Audio error:", e);
            if (lipSync) lipSync.stop();
            audioElement = null;
            setStatus("在线");
            notifyRN({ audioError: true });
        });
    }

    // ===== Handle React Native commands =====
    window.addEventListener("message", function(event) {
        var data;
        try { data = JSON.parse(event.data); } catch(e) { return; }

        console.log("[DH] RN cmd:", data.action);

        switch (data.action) {
            case "speak":
                if (data.base64Audio) {
                    var byteStr = atob(data.base64Audio);
                    var bytes = new Uint8Array(byteStr.length);
                    for (var i = 0; i < byteStr.length; i++) {
                        bytes[i] = byteStr.charCodeAt(i);
                    }
                    var blob = new Blob([bytes], { type: "audio/mp3" });
                    playAudio(URL.createObjectURL(blob));
                } else if (data.audioUrl) {
                    playAudio(data.audioUrl);
                }
                break;

            case "idle":
                if (audioElement) { audioElement.pause(); audioElement = null; }
                if (lipSync) lipSync.stop();
                setStatus("在线");
                break;

            case "setStatus":
                setStatus(data.text);
                break;
        }
    });

    // Bootstrap
    initLive2D().catch(function(e) {
        console.error("Live2D init error:", e);
    });
    </script>
</body>
</html>
