<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景区AI数字人导游</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- PixiJS v6 -->
    <script src="/js/pixi.min.js"></script>
    <!-- Live2D Cubism Core -->
    <script src="/js/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display (Cubism 4) -->
    <script src="/js/cubism4.js"></script>
</head>
<body>
    <!-- 顶部栏 -->
    <div class="header">
        <div class="logo">🏔️ <span>AI数字人</span>导游</div>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">在线</span>
        </div>
    </div>

    <!-- 主体 -->
    <div class="main">
        <!-- Live2D画布 -->
        <div class="live2d-stage" id="live2dStage">
            <canvas id="live2dCanvas"></canvas>
        </div>

        <!-- 对话面板 -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    你好！我是本景区的AI数字人导游"小景"，有什么可以帮你的吗？
                </div>
            </div>
            <div class="input-bar">
                <button class="btn-mic" id="btnMic" title="语音输入">🎤</button>
                <input type="text" id="inputText" placeholder="输入你想问的..." autocomplete="off">
                <button class="btn-send" id="btnSend" title="发送">➤</button>
            </div>
        </div>
    </div>

    <script src="/js/websocket.js"></script>
    <script src="/js/lipsync.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
